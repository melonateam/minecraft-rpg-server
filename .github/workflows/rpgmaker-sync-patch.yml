name: RPGMaker sync patch

on:
  push:
    branches:
      - codex/rpgmaker-sync-rng-theme

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rpgmaker-sync-rng-theme
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rpgmaker-web-editor/package-lock.json

      - name: Patch RPGMaker plugin and web editor
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Patch anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Plugin version: makes it obvious whether the server is running the rebuilt jar.
          replace_once(
              'dialogue-display-plugin/build.gradle.kts',
              'version = "1.0.0"',
              'version = "1.1.0"',
          )

          # API/server compatibility validation must match the runtime/editor limit.
          replace_once(
              'dialogue-display-plugin/src/main/java/kr/hyuni/dialogue/DialogueCompatibilityService.java',
              'private static final int MAXIMUM_PAGES = 10;',
              'private static final int MAXIMUM_PAGES = 30;',
          )

          plugin = Path('dialogue-display-plugin/src/main/java/kr/hyuni/dialogue/DialogueDisplayPlugin.java')
          text = plugin.read_text(encoding='utf-8')

          if 'private static final int MAXIMUM_PAGES = 30;' not in text:
              text = text.replace('private static final int MAXIMUM_PAGES = 10;', 'private static final int MAXIMUM_PAGES = 30;', 1)

          # Expose web command in tab completion.
          text = text.replace(
              'List.of("help", "editor", "items", "examples", "load", "play", "delete", "share", "list", "edit", "edit2", "save", "show", "close", "admin")',
              'List.of("help", "editor", "web", "items", "examples", "load", "play", "delete", "share", "list", "edit", "edit2", "save", "show", "close", "admin")',
              1,
          )
          text = text.replace(
              'List.of("help", "editor", "items", "examples", "load", "play", "delete", "share", "list", "close")',
              'List.of("help", "editor", "web", "items", "examples", "load", "play", "delete", "share", "list", "close")',
              1,
          )

          # Add web command to help if missing.
          help_anchor = 'sender.sendMessage(Component.text("/rpgmaker items", NamedTextColor.YELLOW)'
          if '/rpgmaker web' not in text[text.find('private void sendHelp'):text.find('private void sendEditorHelp') if 'private void sendEditorHelp' in text else len(text)]:
              idx = text.find(help_anchor)
              if idx < 0:
                  raise SystemExit('sendHelp anchor not found')
              web_help = (
                  'sender.sendMessage(Component.text("/rpgmaker web", NamedTextColor.YELLOW)\n'
                  '                .append(Component.text(" - 현재 플레이어로 웹 에디터 연결 링크 열기", NamedTextColor.GRAY)));\n        '
              )
              text = text[:idx] + web_help + text[idx:]

          # Random range support for variable effects. Syntax is random(min..max), deliberately avoiding commas
          # because effect lists themselves are comma-separated.
          old_calc = '''if (!variable.isBlank()) setVariableValue(player, variable, ExpressionRules.calculate(\n                    current, assignment.group(2), expandVariables(player, assignment.group(3))));'''
          new_calc = '''if (!variable.isBlank()) setVariableValue(player, variable, ExpressionRules.calculate(\n                    current, assignment.group(2), resolveEffectOperand(player, assignment.group(3))));'''
          if old_calc not in text:
              raise SystemExit('variable effect calculation anchor not found')
          text = text.replace(old_calc, new_calc, 1)

          method_anchor = '    private List<String> effectEntries(String value) {'
          random_method = r'''    private String resolveEffectOperand(Player player, String rawValue) {
              String expanded = expandVariables(player, rawValue == null ? "" : rawValue).strip();
              java.util.regex.Matcher random = java.util.regex.Pattern
                      .compile("(?i)^random\\(\\s*(-?\\d+)\\s*\\.\\.\\s*(-?\\d+)\\s*\\)$")
                      .matcher(expanded);
              if (!random.matches()) return expanded;
              try {
                  long first = Long.parseLong(random.group(1));
                  long second = Long.parseLong(random.group(2));
                  long minimum = Math.min(first, second);
                  long maximum = Math.max(first, second);
                  if (minimum == maximum) return Long.toString(minimum);
                  long generated;
                  if (maximum == Long.MAX_VALUE) {
                      generated = java.util.concurrent.ThreadLocalRandom.current().nextLong(minimum, maximum);
                      if (java.util.concurrent.ThreadLocalRandom.current().nextBoolean()) generated = maximum;
                  } else {
                      generated = java.util.concurrent.ThreadLocalRandom.current().nextLong(minimum, maximum + 1L);
                  }
                  return Long.toString(generated);
              } catch (RuntimeException ignored) {
                  return expanded;
              }
          }

'''
          if 'private String resolveEffectOperand(' not in text:
              if method_anchor not in text:
                  raise SystemExit('effectEntries anchor not found')
              text = text.replace(method_anchor, random_method + method_anchor, 1)

          plugin.write_text(text, encoding='utf-8')

          # Web: make condition/effect variable identifiers obey the same rule.
          condition = Path('rpgmaker-web-editor/src/components/conditions/ConditionBuilder.tsx')
          ctext = condition.read_text(encoding='utf-8')
          ctext = ctext.replace(
              r"/^([\p{L}\p{N}_-]+)\s*(==|=|!=|>=|<=|>|<)\s*(.*)$/u",
              r"/^([A-Za-z0-9_.-]+)\s*(==|=|!=|>=|<=|>|<)\s*(.*)$/",
          )
          ctext = ctext.replace(
              '내부 expression을 직접 작성할 필요가 없습니다.',
              '효과의 변수 연산과 같은 변수명 규칙(A-Z, a-z, 숫자, _, ., -)을 사용합니다.',
          )
          condition.write_text(ctext, encoding='utf-8')

          # Web: variable mutation UI gains integer random range generation.
          effects = Path('rpgmaker-web-editor/src/components/editor/EffectsInspector.tsx')
          etext = effects.read_text(encoding='utf-8')
          etext = etext.replace(
              "operator: '=' | '+=' | '-=' | '*=' | '/=';",
              "operator: '=' | '+=' | '-=' | '*=' | '/=' | 'random';",
              1,
          )
          old_parse = '''      const match = entry.match(/^([A-Za-z0-9_.-]+)\\s*(\\+=|-=|\\*=|\\/=|=)\\s*(.*)$/);\n      return match\n        ? {\n            name: match[1],\n            operator: match[2] as VariableAssignment['operator'],\n            value: match[3],\n          }\n        : { name: entry, operator: '=', value: '' };'''
          new_parse = '''      const random = entry.match(/^([A-Za-z0-9_.-]+)\\s*=\\s*random\\(\\s*(-?\\d+)\\s*\\.\\.\\s*(-?\\d+)\\s*\\)$/i);\n      if (random) return { name: random[1], operator: 'random' as const, value: `${random[2]}..${random[3]}` };\n      const match = entry.match(/^([A-Za-z0-9_.-]+)\\s*(\\+=|-=|\\*=|\\/=|=)\\s*(.*)$/);\n      return match\n        ? {\n            name: match[1],\n            operator: match[2] as VariableAssignment['operator'],\n            value: match[3],\n          }\n        : { name: entry, operator: '=', value: '' };'''
          if old_parse not in etext:
              raise SystemExit('EffectsInspector parse anchor not found')
          etext = etext.replace(old_parse, new_parse, 1)
          etext = etext.replace(
              "return rows.map((row) => `${row.name}${row.operator}${row.value}`).join(', ');",
              "return rows.map((row) => row.operator === 'random' ? `${row.name}=random(${row.value || '0..100'})` : `${row.name}${row.operator}${row.value}`).join(', ');",
              1,
          )
          etext = etext.replace(
              "  if (operator === '*=') return '현재 값에 곱함';\n  return '현재 값을 나눔';",
              "  if (operator === '*=') return '현재 값에 곱함';\n  if (operator === '/=') return '현재 값을 나눔';\n  return '지정 범위에서 정수 난수를 생성해 설정';",
              1,
          )
          etext = etext.replace(
              '<option value="/=">/=</option>',
              '<option value="/=">/=</option>\n                    <option value="random">난수</option>',
              1,
          )
          etext = etext.replace(
              'placeholder="값"\n                    onChange={(event) => updateAssignment(index, { value: event.target.value })}',
              "placeholder={row.operator === 'random' ? '최소..최대 (예: 1..100)' : '값'}\n                    onChange={(event) => updateAssignment(index, { value: event.target.value })}",
              1,
          )
          etext = etext.replace(
              "{ name: 'variable', operator: '=', value: '0' },",
              "{ name: 'variable', operator: '=', value: '0' },",
              1,
          )
          # Make built-in variables visible in the effect selector too, matching condition tooling.
          datalist_anchor = '''          <datalist id="rpgmaker-effect-variable-names">\n            {project.variables.map((variable) => ('''
          datalist_new = '''          <datalist id="rpgmaker-effect-variable-names">\n            {['player_name', 'player_world', 'player_x', 'player_y', 'player_z', 'player_health', 'held_item_name', 'held_item_type', 'held_item_amount'].map((name) => (\n              <option key={`builtin-${name}`} value={name} />\n            ))}\n            {project.variables.map((variable) => ('''
          if datalist_anchor not in etext:
              raise SystemExit('EffectsInspector datalist anchor not found')
          etext = etext.replace(datalist_anchor, datalist_new, 1)
          effects.write_text(etext, encoding='utf-8')

          # Web theme: preserve dark editor ergonomics, but provide stronger semantic section separation.
          css = Path('rpgmaker-web-editor/src/index.css')
          css.write_text('''@import "tailwindcss";\n\n:root {\n  color: #eef4f8;\n  background: #081018;\n  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  font-synthesis: none;\n  text-rendering: optimizeLegibility;\n  --rpg-bg: #081018;\n  --rpg-panel: #101923;\n  --rpg-panel-raised: #172331;\n  --rpg-border: #2a3b4d;\n  --rpg-cyan: #42d4d0;\n  --rpg-violet: #9d8cff;\n  --rpg-gold: #f1c66d;\n  --rpg-green: #70d6a3;\n  --rpg-danger: #ff8f9c;\n}\n\n* { box-sizing: border-box; }\nbody {\n  margin: 0;\n  min-width: 1280px;\n  min-height: 100vh;\n  background:\n    radial-gradient(circle at 16% 0%, rgba(66, 212, 208, 0.10), transparent 31rem),\n    radial-gradient(circle at 84% 8%, rgba(157, 140, 255, 0.10), transparent 34rem),\n    var(--rpg-bg);\n}\nbutton, input, select, textarea { font: inherit; }\nbutton:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {\n  outline: 2px solid var(--rpg-cyan);\n  outline-offset: 2px;\n}\n.scrollbar-thin { scrollbar-width: thin; scrollbar-color: #466077 transparent; }\n\n/* Existing Tailwind arbitrary colors are mapped into a clearer editor palette without rewriting every component. */\n[class~="bg-[#0f1115]"], [class~="bg-[#12161b]"], [class~="bg-[#101419]"] { background-color: #081018 !important; }\n[class~="bg-[#15181e]"], [class~="bg-[#16191f]"], [class~="bg-[#171b21]"], [class~="bg-[#14191f]"] { background-color: #101923 !important; }\n[class~="bg-[#1a1e25]"], [class~="bg-[#1d2129]"], [class~="bg-[#20252d]"], [class~="bg-[#222730]"] { background-color: #172331 !important; }\n[class~="border-[#242a33]"], [class~="border-[#242933]"], [class~="border-[#2a3039]"], [class~="border-[#292f39]"] { border-color: #2a3b4d !important; }\n[class~="text-[#7c8cff]"], [class~="text-[#8b99ff]"] { color: var(--rpg-violet) !important; }\n\n/* Semantic panels: conditions = cyan, effects = violet/gold, validation/errors = red. */\n[data-rpg-section="condition"] { border-left: 3px solid var(--rpg-cyan); background: rgba(66, 212, 208, 0.055); }\n[data-rpg-section="effect"] { border-left: 3px solid var(--rpg-violet); background: rgba(157, 140, 255, 0.055); }\n[data-rpg-section="flow"] { border-left: 3px solid var(--rpg-gold); background: rgba(241, 198, 109, 0.05); }\n::selection { background: rgba(66, 212, 208, 0.28); color: #ffffff; }\n''', encoding='utf-8')

          # Make the dashboard visually distinct with the same palette.
          dashboard = Path('rpgmaker-web-editor/src/components/dashboard/Dashboard.tsx')
          dtext = dashboard.read_text(encoding='utf-8')
          dtext = dtext.replace('bg-[#0f1115]', 'bg-transparent', 1)
          dtext = dtext.replace('text-[#7c8cff]">RPGMAKER', 'text-[#42d4d0]">RPGMAKER', 1)
          dtext = dtext.replace('bg-[#7c8cff]', 'bg-gradient-to-r from-[#36bfc0] to-[#8f7cf6]', 1)
          dtext = dtext.replace('bg-[#16191f] p-5 transition hover:bg-[#1d2129]', 'border border-[#2a3b4d] bg-[#101923]/90 p-5 shadow-lg shadow-black/10 transition hover:-translate-y-0.5 hover:border-[#42d4d0]/60 hover:bg-[#172331]')
          dashboard.write_text(dtext, encoding='utf-8')

          # Remove this one-shot workflow from the final PR diff.
          Path('.github/workflows/rpgmaker-sync-patch.yml').unlink(missing_ok=True)

      - name: Typecheck and build web editor
        working-directory: rpgmaker-web-editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build RPGMaker plugin
        run: gradle -p dialogue-display-plugin clean build --no-daemon

      - name: Deploy rebuilt RPGMaker jar into server tree
        run: |
          JAR=$(find dialogue-display-plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" minecraft-server-1.21.8/plugins/RPGMaker.jar
          ls -lh minecraft-server-1.21.8/plugins/RPGMaker.jar

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sync RPGMaker variables, random effects, web theme and deployed jar"
          git push origin HEAD:codex/rpgmaker-sync-rng-theme
