name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
      - run: gradle -p dialogue-display-plugin build --no-daemon
      - run: gradle -p rpg-server-admin-plugin build --no-daemon
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rpgmaker-web-editor/package-lock.json
      - run: npm ci
        working-directory: rpgmaker-web-editor
      - run: npm run typecheck
        working-directory: rpgmaker-web-editor
      - run: npm run check:migration
        working-directory: rpgmaker-web-editor
      - run: npm run check:preview
        working-directory: rpgmaker-web-editor
      - run: npm run check:return-targets
        working-directory: rpgmaker-web-editor
      - run: npm run check:validator
        working-directory: rpgmaker-web-editor
      - run: npm run build
        working-directory: rpgmaker-web-editor
