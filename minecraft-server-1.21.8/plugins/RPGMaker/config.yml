              end-2: false
          end-2: false
          choice-3: 처음부터 듣기
          response-pages-3:
          - 처음부터 다시 이야기할게요.
          response-portrait-3:
            '0': FEMALE_NOBLE
          response-expression-3:
            '0': HAPPY
          response-effects-3:
