    달빛_아래_피어난_약속:
      example-version: 3
      built-in-example: true
      title: 달빛 아래 피어난 약속 · 최종판
      speaker: 세레나
      portrait: FEMALE_NOBLE
      expression: NEUTRAL
      camera-direction: NORTH
      message-pages:
      - |-
        #FFD966:달빛이 정원을 비추고 있어요.
        오래 기다렸죠, 용사님.
        오늘은 제 진심을 전할게요.
      - |-
        이 #FF77CC:편지에는 제 마음과
        두 사람의 약속이 담겨 있어요.
        받아 주시겠어요?
      - |-
        #FF77CC:당신의 대답을 듣고 싶어요.
        어떤 관계로 남고 싶은지
        솔직하게 말해 주세요.
      - |-
        오늘의 #FFD966:약속을 기억할게요.
        다음 달빛 아래에서도
        다시 만나요.
      page-portraits:
        '0': FEMALE_NOBLE
        '1': FEMALE_NOBLE
        '2': FEMALE_NOBLE
        '3': FEMALE_NOBLE
      page-expressions:
        '0': NEUTRAL
        '1': EMBARRASSED
        '2': SURPRISED
        '3': HAPPY
      page-effects:
        '0':
          sounds: minecraft:block.amethyst_block.chime:1.1:0.8:2
          message: 세레나와의 최종 예제가 시작되었습니다.
          message-color: '#DDA0DD'
        '3':
          variables-delete: temporary_hint
          sounds: minecraft:ui.toast.challenge_complete:1.0:0.8:1
          message: 달빛 아래의 약속 이야기를 마쳤습니다.
          message-color: '#FFD966'
          command: tellraw {target} {"text":"[연애 예제] 이야기를 완료했습니다.","color":"light_purple"}
          command-target: PLAYER
      page-conditions:
        '2':
          type: BOTH
          variable: promise
          value: begun
          extra-variables: affection=2,trust=yes
          variable-logic: OR
          item-spec: '@417173a0-ff8e-4e26-b375-566e4731d540/moon_letter:1'
          replacement: |-
            편지와 #FF77CC:마음이 같은 답을
            가리키고 있어요.
            이제 우리 관계를 정해요.
      page-choices:
        '1':
          choice-count: 3
          choice-1: 편지를 받는다
          response-pages-1:
          - |-
            고마워요. 이 #FFD966:달빛의 편지를
            소중히 간직해 주세요.
          - |-
            당신의 손이 따뜻해서
            조금 용기가 생겼어요.
          response-portrait-1:
            '0': FEMALE_NOBLE
            '1': FEMALE_NOBLE
          response-expression-1:
            '0': EMBARRASSED
            '1': HAPPY
          response-effects-1:
            '0':
              items: '@417173a0-ff8e-4e26-b375-566e4731d540/moon_letter:1'
              variables-set: promise=begun, affection=2
              sounds: minecraft:entity.player.levelup:1.2:0.8:1
              message: 달빛의 편지를 받았습니다.
              message-color: '#FFD966'
            '1':
              command: tellraw {target} {"text":"세레나의 호감도가 올랐습니다.","color":"light_purple"}
              command-target: PLAYER
          end-1: false
          choice-2: 진실을 묻는다
          response-pages-2:
          - |-
            제 진실은 단 하나예요.
            #FF77CC:당신을 오래 기다렸어요.
          - 이 말을 믿어 주실래요?
          response-portrait-2:
            '0': FEMALE_NOBLE
            '1': FEMALE_NOBLE
          response-expression-2:
            '0': SAD
            '1': SURPRISED
          response-page-choices-2:
            '1':
              choice-count: 2
              choice-1: 믿는다고 한다
              response-pages-1:
              - |-
                그 한마디면 충분해요.
                제 #FF77CC:진심을 받아 주세요.
              - 함께 앞으로 걸어가요.
              response-portrait-1:
                '0': FEMALE_NOBLE
                '1': FEMALE_NOBLE
              response-expression-1:
                '0': SURPRISED
                '1': HAPPY
              response-effects-1:
                '1':
                  items: '@417173a0-ff8e-4e26-b375-566e4731d540/moon_letter:1'
                  variables-set: trust=yes, promise=begun, affection=2
                  sounds: minecraft:block.amethyst_block.resonate:1.2:1.0:1
                  message: 신뢰와 편지를 얻었습니다.
                  message-color: '#FF77CC'
              end-1: false
              choice-2: 잠시 생각한다
              response-pages-2:
              - |-
                괜찮아요. 다시 질문을
                천천히 읽어 보세요.
              response-expression-2:
                '0': SAD
              response-effects-2:
                '0':
                  variables-set: temporary_hint=retry
                  return-mode: TARGET
                  return-target: PAGE:p1
              end-2: false
          end-2: false
          choice-3: 처음부터 듣기
          response-pages-3:
          - 처음부터 다시 이야기할게요.
          response-portrait-3:
            '0': FEMALE_NOBLE
          response-expression-3:
            '0': HAPPY
          response-effects-3:
            '0':
              return-mode: TARGET
              return-target: PAGE:p0
          end-3: false
        '2':
          choice-count: 3
          choice-1: 연인이 된다
          condition-1:
            type: BOTH
            variable: promise
            value: begun
            extra-variables: affection=2,trust=yes
            variable-logic: OR
            item-spec: '@417173a0-ff8e-4e26-b375-566e4731d540/moon_letter:1'
          response-pages-1:
          - 정말인가요? 꿈만 같아요.
          - |-
            이 #FF77CC:약속의 반지를 받아요.
            기쁜 날도 슬픈 날도
            언제나 곁에 있을게요.
          response-portrait-1:
            '0': FEMALE_NOBLE
            '1': FEMALE_NOBLE
          response-expression-1:
            '0': SURPRISED
            '1': HAPPY
          response-effects-1:
            '1':
              items: '@417173a0-ff8e-4e26-b375-566e4731d540/promise_ring:1'
              take-items: '@417173a0-ff8e-4e26-b375-566e4731d540/moon_letter:1'
              variables-set: relationship=lover
              variables-delete: temporary_hint
              sounds: minecraft:ui.toast.challenge_complete:1.1:1.0:1
              message: 세레나와 연인이 되었습니다.
              message-color: '#FF77CC'
              command: tellraw {target} {"text":"영원의 약속을 맺었습니다!","color":"gold"}
              command-target: PLAYER
          end-1: false
          choice-2: 친구로 남는다
          response-pages-2:
          - |-
            조금 아쉽지만 괜찮아요.
            #55FFFF:소중한 친구로 남을게요.
          response-expression-2:
            '0': SAD
          response-effects-2:
            '0':
              variables-set: relationship=friend
              sounds: minecraft:entity.allay.ambient_with_item:1.0:0.8:1
              message: 친구 경로를 선택했습니다.
              message-color: '#55FFFF'
          end-2: false
          choice-3: 선택 다시 보기
          response-pages-3:
          - 마음을 정할 때까지 기다릴게요.
          response-expression-3:
            '0': EMBARRASSED
          response-effects-3:
            '0':
              return-mode: TARGET
              return-target: CHOICE:p2#c0
          end-3: false
