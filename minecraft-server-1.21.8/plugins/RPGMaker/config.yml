            variable-logic: OR
            item-spec: '@88ab4f4b-bed0-45ac-a1ce-befcd67fd548/moon_letter:1'
          response-pages-1:
          - 정말인가요? 꿈만 같아요.
          - |-
            이 #FF77CC:약속의 반지를 받아요.
            기쁜 날도 슬픈 날도
