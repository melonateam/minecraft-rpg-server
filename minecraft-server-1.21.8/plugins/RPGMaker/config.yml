          command: tellraw {target} {"text":"[연애 예제] 이야기를 완료했습니다.","color":"light_purple"}
          command-target: PLAYER
      page-conditions:
        '2':
          type: BOTH
          variable: promise
          value: begun
          extra-variables: affection=2,trust=yes
          variable-logic: OR
          item-spec: '@88ab4f4b-bed0-45ac-a1ce-befcd67fd548/moon_letter:1'
          replacement: |-
            편지와 #FF77CC:마음이 같은 답을
            가리키고 있어요.
            이제 우리 관계를 정해요.
      page-choices:
        '1':
          choice-count: 3
          choice-1: 편지를 받는다
          response-pages-1:
          - |-
            고마워요. 이 #FFD966:달빛의 편지를
            소중히 간직해 주세요.
